
fft:
    size: 8192

envelope:
    env_mode: "arithmetic"      # exponential, arithmetic
    attack: 10                  # ms [python only]
    decay: 1700                 # ms
    color: 1.0                  # exponent
    tilt: -0.25                 # -1 to 1
    shift: 0                    # bins (static shift)
    drift: 0                    # bins (dynamic shift)

stereo:
    link: false
    width: 1.0                  # 0 to 1

eq:
    low_cut: 20                 # Hz (null = bypass)
    high_cut: 20000             # Hz (null = bypass)

early_reflections:
    taps: 20
    predelay: 19                # ms, relative to t=0
    taildelay: 100              # ms, relative to t=0
    decay_rate: 0.2             # [python only] ER decay in dB/ms from the first tap; mirrors the plugin
    er2tail_gain: 0.00          # [python only] send ER signal to tail reverberator
    er_preset: null             # [python only] load a preset for the ER-IR: null, 'boston_er'

mix:
    dry_level: -6               # dB
    er_level: -120              # dB
    tail_level: -12             # dB

foreverb:
    enabled: false
    freeze_input: false

debug:
    ignore_causality: false
    transform_only: false
    dev_option: null            # None
